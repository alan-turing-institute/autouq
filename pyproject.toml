[project]
name = "autouq"
version = "0.0.1"
description = "AutoUQ: fast uncertainty quantification for spatiotemporal models."
readme = "README.md"
authors = [
    { name = "AI for Physical Systems Team at The Alan Turing Institute", email = "ai4physics@turing.ac.uk" },
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "beartype>=0.22.8",
    "einops>=0.8.1",
    "jaxtyping>=0.3.3",
    "numpy>=2.4.6",
    "torch>=2.9.1",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.1.0",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "ruff==0.14.14",
    "ty==0.0.55",
    "prek>=0.4.2",
]

[project.scripts]
autouq = "autouq:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "D",   # docstring conventions
    "E",
    "F",
    "W",   # flake8
    "B",   # flake8-bugbear
    "I",   # isort
    "ARG", # flake8-unused-arguments
    "C4",  # flake8-comprehensions
    "EM",  # flake8-errmsg
    "ICN", # flake8-import-conventions
    "ISC", # flake8-implicit-str-concat
    "G",   # flake8-logging-format
    "PGH", # pygrep-hooks
    "PIE", # flake8-pie
    "PL",  # pylint
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "RUF", # Ruff-specific
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "YTT", # flake8-2020
    "EXE", # flake8-executable
]

ignore = [
    "PLR2004", # Magic value used in comparison
    "EM102",   # Exception must not use an f-string literal, assign to variable first
    "ISC001",  # Conflicts with formatter
    # "D417",    # Missing trailing new line in docstring
    "D100",    # Missing docstring in public module
    "D102",    # Missing docstring in public method, TODO: remove in future
    "D104",    # Missing docstring in public package
    "D107",    # Missing docstring in __init__ (documented at class level in Google style)
    "PLR0913", # too many arguments
    "RET504",  # Allow assignment to variable before return
]

unfixable = [
    "F401", # Would remove unused imports
    "F841", # Would remove unused variables
]
flake8-unused-arguments.ignore-variadic-names = true # allow unused *args/**kwargs

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D"]
